<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人教育訓練學習護照</title>
    <style>
        /* 重置預設邊距，確保全螢幕滿版 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 隱藏最外層的滾動條 */
            background-color: #f0f2f5; /* 配合您原本護照系統的背景底色 */
        }
        
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* 核心魔法：操控觀景窗 */
        iframe {
            position: absolute;
            top: -15px; /* 【關鍵】將畫面往上推 15 像素，隱藏橫幅 */
            left: 0;
            width: 100%;
            height: calc(100% + 15px); /* 【關鍵】高度補回 15 像素 */
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- 💡 已經在網址最後面加上 ?v=2 來破除系統快取！ -->
        <iframe src="https://script.google.com/macros/s/AKfycbzxpSeUh6J4Knnn2zW69h0uz6T14Lsd-uD8Tb6kKHOtFCr8KlrdhrwBgWnrPJezIgh5/exec?v=2" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen"></iframe>
    </div>
</body>
</html>
